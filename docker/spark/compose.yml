name: flight-spark
services:
  network:
    image: tailscale/tailscale:v1.90.9
    hostname: ${NODE_NAME:?Set NODE_NAME in .env}
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: 'false'
    volumes:
      - tailscale_state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add: [NET_ADMIN]
    healthcheck:
      test: ['CMD', 'tailscale', 'ip', '-4']
      interval: 5s
      timeout: 3s
      retries: 120
  master:
    profiles: [master]
    image: flight-spark:3.5.3
    build:
      context: ../..
      dockerfile: docker/spark/Dockerfile
    network_mode: service:network
    depends_on:
      network: {condition: service_healthy}
    command: [master]
    volumes: ['../..:/workspace']
  worker:
    image: flight-spark:3.5.3
    build:
      context: ../..
      dockerfile: docker/spark/Dockerfile
    network_mode: service:network
    depends_on:
      network: {condition: service_healthy}
    environment:
      MASTER_IP: ${MASTER_IP:-}
    command: [worker]
    volumes: ['../..:/workspace']
  driver:
    profiles: [driver]
    image: flight-spark:3.5.3
    network_mode: service:network
    depends_on:
      network: {condition: service_healthy}
    environment:
      MASTER_IP: ${MASTER_IP:-}
    command: [check]
    volumes: ['../..:/workspace']
  namenode:
    profiles: [master]
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    network_mode: service:network
    depends_on:
      network: {condition: service_healthy}
    environment:
      CLUSTER_NAME: flight-spark
      CORE_CONF_fs_defaultFS: hdfs://${MASTER_IP:-}:9000
      HDFS_CONF_dfs_replication: 1
      HDFS_CONF_dfs_permissions_enabled: 'false'
      HDFS_CONF_dfs_namenode_rpc___bind___host: 0.0.0.0
    volumes: ['namenode:/hadoop/dfs/name']
  datanode:
    profiles: [master]
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    network_mode: service:network
    depends_on: [namenode]
    environment:
      CORE_CONF_fs_defaultFS: hdfs://${MASTER_IP:-}:9000
      HDFS_CONF_dfs_datanode_hostname: ${MASTER_IP:-}
      HDFS_CONF_dfs_client_use_datanode_hostname: 'true'
      HDFS_CONF_dfs_replication: 1
      HDFS_CONF_dfs_permissions_enabled: 'false'
      SERVICE_PRECONDITION: ${MASTER_IP:-}:9000
    volumes: ['datanode:/hadoop/dfs/data']
volumes:
  tailscale_state:
  namenode:
  datanode:
